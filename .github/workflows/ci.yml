name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(vars.NEXA_PUBLIC_SELF_HOSTED_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","buildchan"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          # Self-hosted runners share ~/.npm and the pnpm store; do not archive them per job.
          package-manager-cache: false

      - name: Install pnpm (isolated per job)
        shell: bash
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --prefix "${RUNNER_TEMP}/ci-pnpm" --ignore-scripts --no-audit --no-fund "pnpm@${PNPM_VERSION}"
          export PATH="${RUNNER_TEMP}/ci-pnpm/node_modules/.bin:${PATH}"
          echo "${RUNNER_TEMP}/ci-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run todos:validate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  secrets-scan:
    runs-on: ${{ fromJSON(vars.NEXA_PUBLIC_SELF_HOSTED_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","ARM64","buildchan"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64)
              platform=darwin_arm64
              checksum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
              ;;
            Linux/X64)
              platform=linux_x64
              checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              ;;
            *) echo "Unsupported scanner platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz" \
            --output "$archive"
          echo "${checksum}  ${archive}" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: gitleaks git --redact --verbose --no-banner
